<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pass/Fail Table</title>
        <script src="https://serratus.github.io/quaggaJS/examples/js/quagga.min.js"></script>
        <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
        <style>
            body {
                margin: 0;
                font-family: Arial;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            body div {
                padding-bottom: 1rem;
            }
            button {
                padding: 1px 16px;
                border: 1px solid black;
                border-radius: 8px;
            }
            table, th, td {
                border: 1px solid black;
                border-collapse: collapse;
            }
            table {
                margin: 2rem;
                padding: 8px;
                text-align: center;
                width: 75%;
            }
            th {
                background-color: rgb(57, 211, 78);
            }
            .email-col {
                text-align: start;
            }
        </style>
    </head>
    <body>
        <table id="passed-table">
            <thead>
                <tr>
                    <th>Learner</th>
                    <th>Passed</th>
                </tr>
            </thead>
            <tbody id="passed-body"></tbody>
        </table>

        <script type="text/javascript">
            const passedTblBody = document.querySelector('#passed-body');

            let data = [];

            // --- API CALLS ---

            async function getUserById(id) {
                try {
                    const workatoUserEndpoint = `${WORKATO_GET_USER_URL}?id=${id}`;
                    const res = await fetch(workatoUserEndpoint, { 
                        method: 'GET',
                        headers: {
                            'api-token': WORKATO_API_TOKEN,
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    
                    const userData = await res.json();
                    return userData || {}; 

                } catch(error) {
                    console.error("User Fetch Failed:", error);
                    return [];
                }
            }

            // --- TABLE FUNCTIONS ---

            function syncTable(entry) {
                if(!data.map(d => d.email).includes(entry)) {
                    data.push({
                        email: entry,
                        passed: false
                    });
                    renderTable();
                }
            }

            function renderTable() {
                passedTblBody.innerHTML = "";

                data.forEach((row, index) => {
                    const tr = document.createElement("tr");

                    const tdEmail = document.createElement("td");
                    tdEmail.textContent = data[index].email;

                    const tdCheckbox = document.createElement("td");
                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.checked = data[index].passed;
                    checkbox.addEventListener('input', () => {
                        data[index].passed = !data[index].passed;
                    });

                    tdCheckbox.appendChild(checkbox);
                    tr.appendChild(tdEmail);
                    tr.appendChild(tdCheckbox);
                    passedTblBody.appendChild(tr);
                });
            }

            // --- JOTFORM WIDGET INITIALIZATION ---

            JFCustomWidget.subscribe("ready", async function(data) {
                // Store prefilled email into widget
                JFCustomWidget.getFieldsValueByName(["learners"], async function(res) {
                    let items = (res && res.data) || [];
                    let learners = items[0].value.split(",");
                    for(entry of learners) {
                        syncTable(entry);
                    }
                });

                JFCustomWidget.subscribe("submit", async function() {
                    const formData = data;
                    const result = {
                        valid: data ? true : false,
                        value: data ? JSON.stringify(data) : ""
                    };
                    JFCustomWidget.sendSubmit(result);
                });
            });
        </script>
    </body>
</html>
